[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiep-pipeline"
version = "0.1.0"
description = "Pipeline FIEP: voltametria de biossensores -> detecção de contaminação microbiana"
readme = "docs/PIPELINE.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.10"]
dev = ["pytest>=7"]

[project.scripts]
fiep = "fiep.cli:main"

[tool.setuptools.packages.find]
include = ["fiep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
