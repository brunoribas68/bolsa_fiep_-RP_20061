[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiep-pipeline"
version = "0.1.0"
description = "Pipeline FIEP: voltametria de biossensores -> detecção de contaminação microbiana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
notebook = ["jupyter>=1.0", "ipykernel>=6"]
mlflow = ["mlflow>=2.10"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
fiep = "fiep.cli:main"

[tool.setuptools.packages.find]
include = ["fiep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
