# Migrations do banco (Alembic). Uso, na raiz do repositório:
#   alembic upgrade head                                  # cria/atualiza dados/fiep.db (com os dados de exemplo)
#   alembic -x url=postgresql+psycopg://u:s@host/fiep upgrade head
#   alembic revision --autogenerate -m "descreva a mudança"   # depois de mexer em fiep/orm/
# O mesmo vale por `fiep db migrar`.
[alembic]
script_location = fiep/migracoes
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
